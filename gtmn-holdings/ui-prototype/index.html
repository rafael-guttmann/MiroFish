<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>GTMN Holdings</title>
<style>
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#16181D; --ink2:#4A4F5A; --ink3:#7A7F8A;
  --line:#E3DFD6; --line2:#CFCABD; --night:#1B1E25;
  --work:#1F7A4D; --wait:#B7791F; --need:#C2410C; --done:#8A8F99;
  --r:14px; --ease:cubic-bezier(.16,1,.3,1);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.45 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{display:grid;grid-template-columns:84px 1fr 340px;grid-template-rows:100vh;height:100vh;height:100dvh}
.rail{background:var(--night);color:#fff;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px}
.brand{font:600 15px var(--serif);letter-spacing:.04em;margin-bottom:18px;text-align:center;line-height:1.1}
.brand small{display:block;font:500 9px var(--sans);letter-spacing:.18em;opacity:.6;margin-top:3px}
.tab{width:64px;padding:10px 0 8px;border-radius:12px;color:#B9BDC7;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;position:relative;transition:background .2s,color .2s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:#262A33;color:#fff}
.tab[aria-selected=true]{background:#fff;color:var(--ink)}
.badge{position:absolute;top:4px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--need);color:#fff;font:600 11px/18px var(--sans);text-align:center;padding:0 5px}
.badge:empty,.badge[data-n="0"]{display:none}
main{overflow:auto;padding:28px 32px 40px;position:relative}
aside{border-left:1px solid var(--line);background:#FBFAF7;overflow:auto;padding:24px 22px}
h1{font:500 30px/1.15 var(--serif);letter-spacing:-.01em}
h2{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
.sub{color:var(--ink2);margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pulse{display:flex;gap:18px;font-size:14px;color:var(--ink2)}
.pulse b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--done)}
.dot.work{background:var(--work);animation:breathe 2s ease-in-out infinite}
.dot.wait{background:var(--wait)} .dot.need{background:var(--need)}
@keyframes breathe{50%{opacity:.35}}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2);margin-bottom:14px;min-height:24px}
.crumbs button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--ink)}

/* building */
.building{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.room{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.room:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(22,24,29,.25);border-color:var(--line2)}
.room::before{content:"";position:absolute;left:16px;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--a)}
.room h3{font:600 16px/1.2 var(--serif)}
.room .role{font-size:13px;color:var(--ink3)}
.room .count{margin-top:auto;font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.room.busy{border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
.room.busy::after{content:"";position:absolute;inset:-1px;border-radius:var(--r);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 14%,transparent);pointer-events:none;animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
.room.need-flag .count span:last-child{color:var(--need);font-weight:600}
.boardroom{grid-column:span 2;background:var(--night);color:#fff;border-color:var(--night)}
.boardroom .role{color:#A9AEBA}.boardroom .count{color:#C9CDD6}
.boardroom::before{background:#fff}
.boardroom.busy::after{box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.table{display:flex;gap:-6px;align-items:center;min-height:30px}
.pawns{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.pawn{width:22px;height:22px;border-radius:50%;background:var(--a,#999);color:#fff;font:600 9px/22px var(--sans);text-align:center;position:relative;opacity:.9;transition:transform .5s var(--ease),opacity .4s}
.pawn.idle{opacity:.28}
.pawn.working{animation:bob 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.pawn.asking{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--need)}
@keyframes bob{50%{transform:translateY(-3px)}}
.bench{font-size:12px;color:var(--ink3);align-self:center;margin-left:2px}
.boardroom .pawn{box-shadow:0 0 0 2px var(--night)}

/* firm view */
.firmhead{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.firmhead i{width:6px;height:44px;border-radius:3px;background:var(--a)}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.desk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;transition:border-color .2s,transform .25s var(--ease)}
.desk:hover{border-color:var(--line2);transform:translateY(-1px)}
.desk .pawn{flex:none;width:34px;height:34px;font-size:12px;line-height:34px}
.desk b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.desk small{font-size:12px;color:var(--ink3)}
.desk.idle{background:transparent;border-style:dashed}
.state-work{color:var(--work)}.state-ask{color:var(--need)}
.group{margin:22px 0 10px}
.agentview{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:640px}
.agentview h3{font:500 24px var(--serif)}
.log{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px;font-size:14px;color:var(--ink2)}
.log time{font:12px var(--sans);color:var(--ink3);margin-right:8px;font-variant-numeric:tabular-nums}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;align-items:start}
.col h2{display:flex;justify-content:space-between}
.col .list{display:grid;gap:10px;min-height:60px}
.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;display:block;width:100%;transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.job:hover{box-shadow:0 8px 20px -12px rgba(22,24,29,.3);transform:translateY(-1px)}
.job b{font-weight:600;font-size:15px;line-height:1.3;display:block}
.job .meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink3)}
.job .meta i{width:8px;height:8px;border-radius:50%;background:var(--a)}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;width:100%;background:var(--ink);border-radius:2px;transform-origin:left;transition:transform 1s var(--ease)}

/* needs you */
.stage{max-width:620px;margin:0 auto}
.counter{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink2);margin-bottom:12px}
.pips{display:flex;gap:5px}.pips i{width:22px;height:4px;border-radius:2px;background:var(--line2)}.pips i.on{background:var(--ink)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 26px 20px;box-shadow:0 18px 40px -24px rgba(22,24,29,.35);animation:slide .45s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateX(28px)}}
@keyframes slideout{to{opacity:0;transform:translateX(-28px)}}
.qcard.out{animation:slideout .28s ease-in forwards}
.from{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.from .pawn{width:26px;height:26px;line-height:26px;font-size:10px}
.q{font:500 24px/1.25 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.opts{display:grid;gap:10px;margin:20px 0 14px}
.opt{display:flex;gap:14px;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;align-items:flex-start;transition:border-color .15s,background .15s,transform .15s var(--ease)}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt:active{transform:scale(.995)}
.opt[aria-pressed=true]{border-color:var(--ink);background:#F3F1EA}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);font:600 12px/22px var(--sans);text-align:center;color:var(--ink2);margin-top:1px}
.opt[aria-pressed=true] .k{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt b{display:flex;gap:8px;align-items:center;font-weight:600;flex-wrap:wrap}
.opt span.d{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.rec{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:#fff;padding:3px 7px;border-radius:5px}
.free{display:flex;gap:8px;border:1.5px dashed var(--line2);border-radius:14px;padding:8px 8px 8px 14px;align-items:flex-end;background:#FDFCFA}
.free:focus-within{border-style:solid;border-color:var(--ink)}
.free textarea{flex:1;border:0;background:none;resize:none;outline:0;padding:6px 0;min-height:24px;max-height:120px}
.send{background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;transition:opacity .2s}
.send:disabled{opacity:.25;cursor:default}
.why{margin-top:14px;font-size:14px;color:var(--ink2)}
.why summary{cursor:pointer;color:var(--ink);font-weight:500;list-style:none}
.why summary::before{content:"+ ";font-weight:600}.why[open] summary::before{content:"– "}
.why p{margin-top:6px}
.default{margin-top:10px;font-size:13px;color:var(--ink3)}
.actions{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ghost{padding:8px 4px;font-size:14px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.ghost:hover{color:var(--ink)}
.empty{text-align:center;padding:70px 20px;color:var(--ink2)}
.empty h1{margin-bottom:8px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;color:var(--ink2);font-size:14px;margin:20px 0 12px;background:#FDFCFA}

/* new demand */
.form{max-width:640px;margin:0 auto}
.big{width:100%;min-height:180px;border:1.5px solid var(--line2);border-radius:16px;padding:18px;background:#fff;resize:vertical;font-size:17px;line-height:1.5;outline:0}
.big:focus{border-color:var(--ink)}
.routes{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1.5px solid var(--line2);border-radius:999px;padding:8px 14px;font-size:14px;background:#fff;display:flex;gap:8px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--a,var(--ink3))}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.route-note{font-size:14px;color:var(--ink2);margin:6px 0 18px;min-height:22px}
.submit{width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:16px;font-weight:600;font-size:16px;transition:transform .2s var(--ease),opacity .2s}
.submit:disabled{opacity:.25;cursor:default}
.submit:not(:disabled):hover{transform:translateY(-1px)}

/* floor: retro console frame */
.fl-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px;scrollbar-width:thin}
.fl-bar .chip{flex:none;padding:7px 13px;font:600 13px/1 var(--sans);border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center}
.fl-bar .chip i{width:9px;height:9px;border-radius:50%;background:var(--a);display:inline-block;margin-right:7px}
.fl-bar .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.fl-bar .chip[aria-pressed=true] i{box-shadow:0 0 0 2px #fff}
.fl-hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:#15171d;color:#c4c9d4;font:500 12.5px/1.2 var(--sans);padding:12px 16px;border-radius:14px 14px 0 0}
.fl-hud b{color:#fff;font-weight:600}.fl-ph{color:#e8c670;font-weight:600}.fl-more{color:#8a90a0}
.fl-tag{background:var(--a);color:#fff;padding:4px 10px;border-radius:99px;font-weight:600}
.fl-wrap{position:relative;overflow-x:auto;overflow-y:hidden;background:#15171d;border-radius:0 0 14px 14px;padding:0 4px 4px;scrollbar-width:thin}
.fl-stage{position:relative;margin:0 auto}
.fl-wrap canvas{display:block;border-radius:10px;cursor:pointer}
.fl-crt{display:none}
.fl-tip{position:absolute;width:240px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px -10px rgba(10,12,18,.45);padding:12px 14px;font-size:14px;z-index:3}
.fl-tip[hidden]{display:none}
.fl-tip b{display:block;font-weight:700}.fl-tip small{color:var(--ink3);font-size:12px}.fl-tip p{margin:8px 0;color:var(--ink2)}
.fl-tip .send{margin-right:8px}
.fl-legend{font:12.5px/1.6 var(--sans);color:var(--ink3);margin-top:10px}
.fl-legend b{color:var(--ink);font-weight:600}

/* work */
.wsum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.wsum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wsum b{display:block;font:600 26px/1 var(--serif)}.wsum b.n{color:var(--need)}.wsum small{color:var(--ink3);font-size:12px}
.wgroup{margin-bottom:20px}.wgroup h2{display:flex;align-items:center;gap:8px}.wgroup h2 i{width:10px;height:10px;border-radius:3px}
.wrow{display:grid;grid-template-columns:1fr auto 44px 108px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.wrow:hover{box-shadow:0 8px 20px -12px rgba(22,24,29,.3);transform:translateY(-1px)}
.wt b{display:block;font-weight:600;font-size:15px;line-height:1.3}.wt small{color:var(--ink3);font-size:12px}
.seg{display:flex;gap:3px}.seg i{width:16px;height:6px;border-radius:2px;background:var(--line)}.seg i.done{background:var(--a)}.seg i.now{background:var(--a);opacity:.55}.seg i.ask{background:var(--need)}
.pc{font-size:13px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.st{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;text-align:center;white-space:nowrap;background:#ECEAE3;color:var(--ink2)}
.st.work{background:#DDEFE5;color:var(--work)}.st.need{background:#F9E1D4;color:var(--need)}.st.wait{background:#F6E8CC;color:var(--wait)}
.wdet{max-width:860px}.whead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.whead h1{margin:8px 0 2px}.ring{width:96px;height:96px;flex:none}
.needbar{display:grid;gap:2px;width:100%;text-align:left;background:#FDF0E7;border:1px solid #F0C9B0;border-radius:12px;padding:12px 14px;margin-bottom:18px}.needbar span{color:var(--ink2);font-size:14px}.needbar em{font-style:normal;font-weight:600;color:var(--need);font-size:14px}
.wdet h2{margin-top:22px}
.steps{display:flex;list-style:none;padding:0;gap:6px}.steps li{flex:1;min-width:0;font-size:12px;color:var(--ink3);text-align:center}
.steps i{display:block;height:8px;border-radius:4px;background:var(--line);font-size:0;margin-bottom:6px}
.steps .done i{background:var(--a)}.steps .now i{background:linear-gradient(90deg,var(--a) 50%,var(--line) 50%)}.steps .ask i{background:linear-gradient(90deg,var(--need) 50%,var(--line) 50%)}
.steps .done,.steps .now,.steps .ask{color:var(--ink)}.steps span{display:block;line-height:1.25}
.wcols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.wcols .desk{margin-bottom:8px;width:100%}
.hb{display:grid;grid-template-columns:130px 1fr 20px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb div{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.hb i{display:block;height:100%;background:var(--a);border-radius:5px}
.tl{border-left:2px solid var(--line);margin-left:6px}.tstage{padding-left:16px;position:relative;margin-bottom:6px}
.th{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:8px 0}.th i{position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line2)}
.tstage.done .th i{background:var(--a);border-color:var(--a)}.tstage.now .th i,.tstage.ask .th i{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 20%,transparent)}.tstage.ask .th i{border-color:var(--need)}
.th small{color:var(--ink3);font-size:12px;margin-left:auto}.th[aria-expanded=true] b::after{content:" ▾"}.th[aria-expanded=false] b::after{content:" ▸";color:var(--ink3)}
.tb{padding:0 0 8px}.ts{display:flex;gap:10px;margin-bottom:10px}.ts .pawn{flex:none;width:30px;height:30px;font-size:11px;line-height:30px}.ts p{color:var(--ink2);font-size:14px}.ts small{color:var(--ink3)}
.nx{list-style:none;padding:0;display:grid;gap:8px}.nx li{background:var(--card);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px}.nx small{display:block;color:var(--ink3);font-size:12px}
@media (max-width:760px){.wsum{grid-template-columns:repeat(2,1fr)}.wrow{grid-template-columns:1fr auto;gap:8px 10px}.wrow .seg{grid-column:1;grid-row:2}.wrow .pc{display:none}.wrow .st{grid-column:2;grid-row:1}.wcols{grid-template-columns:1fr}.whead .ring{width:76px;height:76px}.hb{grid-template-columns:100px 1fr 20px}}

/* aside feed */
.feed{display:grid;gap:14px;margin-bottom:28px}
.ev{display:flex;gap:10px;font-size:14px;line-height:1.35;animation:slide .5s var(--ease)}
.ev .pawn{flex:none;width:24px;height:24px;line-height:24px;font-size:9px}
.ev time{display:block;font-size:12px;color:var(--ink3)}
.mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;width:100%;text-align:left;display:block}
.mini:hover{border-color:var(--line2)}
.mini b{font-weight:600;font-size:14px;display:block}
.mini small{color:var(--ink3);font-size:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:20;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{position:fixed;top:10px;right:360px;font:11px var(--sans);color:var(--ink3);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:999px;z-index:5}

@media (max-width:1180px){.app{grid-template-columns:84px 1fr}aside{display:none}.proto{right:12px}.building{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{order:2;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:0}
  .brand{display:none}
  .tab{flex:1;width:auto;border-radius:10px;padding:8px 0 6px}
  .tab[aria-selected=true]{background:#2B303A;color:#fff}
  .badge{right:calc(50% - 22px)}
  main{padding:18px 16px 24px}
  h1{font-size:25px}
  .building{grid-template-columns:repeat(2,1fr);gap:10px}
  .room{min-height:136px;padding:14px 12px}
  .boardroom{grid-column:span 2}
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -16px;padding:0 16px 8px}
  .col{flex:0 0 82%;scroll-snap-align:start}
  .qcard{padding:20px 18px 14px;border-radius:18px}
  .q{font-size:21px}
